            50: "#fdf2f3"
            100: "#fce7e9"
            200: "#f8cfd3"
            300: "#f1a6b0"
            400: "#e6788a"
            500: "#d9526a"    # PRIMARY
            600: "#c43d54"
            700: "#a33044"
            800: "#872b3a"
            900: "#712632"
            950: "#3d0f16"
          # Terracotta scale
          terracotta:
            50: "#fdf8f5"
            100: "#faefe8"
            200: "#f3dad3"
            300: "#e7bfa1"
            400: "#d8956b"
            500: "#c97543"
            600: "#b85e32"
            700: "#96492a"
            800: "#793e28"
            900: "#633524"
            950: "#341a11"
          # Cream/Warm neutrals
          cream:
            50: "#fefef9"
            100: "#fdfbf0"
            200: "#f9f3db"
            300: "#f3e7b8"
            400: "#ebd788"
            500: "#e2c358"
            600: "#c9a53f"
            700: "#a38133"
            800: "#85672e"
            900: "#6d552a"
            950: "#3a2d13"
          # Warm grays
          stone:
            50: "#fafaf9"
            100: "#f5f5f4"
            200: "#e7e5e4"
            300: "#d6d3d1"
            400: "#a8a29e"
            500: "#78716c"
            600: "#57534e"
            700: "#44403c"
            800: "#292524"
            900: "#1c1917"
            950: "#0c0a09"
        
        semantic:
          primary: "{color.primitive.rose.500}"
          primaryHover: "{color.primitive.rose.600}"
          primaryLight: "{color.primitive.rose.100}"
          primaryDark: "{color.primitive.rose.700}"
          
          secondary: "{color.primitive.terracotta.500}"
          secondaryHover: "{color.primitive.terracotta.600}"
          secondaryLight: "{color.primitive.terracotta.100}"
          
          accent: "{color.primitive.cream.500}"
          accentHover: "{color.primitive.cream.600}"
          
          success: "#16a34a"      # Green-600
          warning: "#ca8a04"      # Yellow-600
          error: "#dc2626"        # Red-600
          info: "#2563eb"         # Blue-600
          
          background: "{color.primitive.cream.50}"
          surface: "#ffffff"
          surfaceRaised: "#ffffff"
          
          border: "{color.primitive.stone.200}"
          borderStrong: "{color.primitive.stone.300}"
          
          textPrimary: "{color.primitive.stone.900}"
          textSecondary: "{color.primitive.stone.600}"
          textMuted: "{color.primitive.stone.400}"
          textInverse: "#ffffff"
          textLink: "{color.primitive.rose.600}"
          
          overlay: "rgba(28, 25, 23, 0.6)"
      
      radius:
        sm: 6
        md: 10
        lg: 16
        xl: 24
        2xl: 32
        # Softer, more organic
      
      shadows:
        sm: "0 1px 3px rgba(141, 48, 68, 0.08)"
        md: "0 4px 12px rgba(141, 48, 68, 0.1), 0 2px 4px rgba(141, 48, 68, 0.06)"
        lg: "0 12px 28px rgba(141, 48, 68, 0.12), 0 4px 8px rgba(141, 48, 68, 0.08)"
        xl: "0 24px 48px rgba(141, 48, 68, 0.15), 0 8px 16px rgba(141, 48, 68, 0.1)"
      
      # Theme-specific component variants
      components:
        button:
          primary:
            padding: "14px 32px"
            fontWeight: 500
            letterSpacing: "0.02em"
            textTransform: "none"
          secondary:
            borderWidth: 2
            padding: "12px 30px"
          ghost:
            padding: "12px 24px"
        card:
          padding: 32
          borderWidth: 1
          imageRadius: 24
        hero:
          minHeight: "90vh"
          paddingTop: 120
          paddingBottom: 80
        nav:
          height: 80
          backdropBlur: true
          borderBottom: "1px solid {color.primitive.stone.100}"

