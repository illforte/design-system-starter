      fonts:
        heading: "Playfair Display, serif"          # Editorial serif
        body: "DM Sans, sans-serif"                 # Clean modern sans
        accent: "Playfair Display, serif"           # Pull quotes, numbers
        mono: "JetBrains Mono, monospace"
      
      # Color palette — Dusty Rose / Terracotta / Cream
      color:
        primitive:
          # Dusty Rose scale
