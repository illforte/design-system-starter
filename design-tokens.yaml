            900: "#512a54"
            950: "#2e1430"
          # Warm neutral
          greige:
            50: "#faf9f7"
            100: "#f4f2ef"
            200: "#e8e5e0"
            300: "#d8d3cb"
            400: "#bdb6ab"
            500: "#a39a8c"
            600: "#867e71"
            700: "#6d655a"
            800: "#5a534a"
            900: "#4a443d"
            950: "#27231e"
          # Soft white
          ivory:
            50: "#fefefe"
            100: "#fdfcfb"
            200: "#faf7f4"
            300: "#f5f0eb"
            400: "#ebe3da"
            500: "#dfd5c8"
            600: "#c4b8a8"
            700: "#a39886"
            800: "#867d6d"
            900: "#6e6657"
            950: "#3a342b"
        
        semantic:
          primary: "{color.primitive.mauve.500}"
          primaryHover: "{color.primitive.mauve.600}"
          primaryLight: "{color.primitive.mauve.100}"
          primaryDark: "{color.primitive.mauve.700}"
          
          secondary: "{color.primitive.greige.600}"
          secondaryHover: "{color.primitive.greige.700}"
          secondaryLight: "{color.primitive.greige.100}"
          
          accent: "{color.primitive.mauve.300}"
          accentHover: "{color.primitive.mauve.400}"
          
          success: "#16a34a"
          warning: "#ca8a04"
          error: "#dc2626"
          info: "#2563eb"
          
          background: "{color.primitive.ivory.50}"
          surface: "#ffffff"
          surfaceRaised: "#ffffff"
          
          border: "{color.primitive.greige.200}"
          borderStrong: "{color.primitive.greige.300}"
          
          textPrimary: "{color.primitive.greige.900}"
          textSecondary: "{color.primitive.greige.600}"
          textMuted: "{color.primitive.greige.400}"
          textInverse: "#ffffff"
          textLink: "{color.primitive.mauve.600}"
          
          overlay: "rgba(39, 35, 30, 0.6)"
      
      radius:
        sm: 8
        md: 16
        lg: 24
        xl: 32
        2xl: 48
        # Generous rounding on images, subtle on UI
      
      shadows:
        sm: "0 1px 3px rgba(105, 38, 82, 0.06)"
        md: "0 4px 16px rgba(105, 38, 82, 0.08), 0 2px 4px rgba(105, 38, 82, 0.04)"
        lg: "0 16px 32px rgba(105, 38, 82, 0.1), 0 6px 12px rgba(105, 38, 82, 0.06)"
        xl: "0 28px 56px rgba(105, 38, 82, 0.12), 0 10px 20px rgba(105, 38, 82, 0.08)"
      
      components:
        button:
          primary:
            padding: "14px 32px"
            fontWeight: 500
            letterSpacing: "0.03em"
            textTransform: "none"
          secondary:
            borderWidth: 1.5
            padding: "12.5px 30.5px"
          ghost:
            padding: "12px 24px"
        card:
          padding: 32
          borderWidth: 1
          imageRadius: 24
        hero:
          minHeight: "90vh"
          paddingTop: 120
          paddingBottom: 80
        nav:
          height: 88
          backdropBlur: true
          borderBottom: "1px solid {color.primitive.greige.100}"


# ═══════════════════════════════════════════
# COMPONENT SPECS (shared structure, theme values applied)
# ═══════════════════════════════════════════
components:
  button:
    heights:
      sm: 36
      md: 44
      lg: 52
      xl: 60
    minWidth: 88
    focusRing: "0 0 0 3px {color.primary} / 0.4"
    disabledOpacity: 0.5
  
  input:
    height: 44
    padding: "12px 16px"
    borderWidth: 1
    placeholderColor: "{color.textMuted}"
    errorColor: "{color.error}"
    successColor: "{color.success}"
  
  card:
    padding: 24
    borderWidth: 1
    gap: 16
    imageAspectRatio: "4/3"
  
  badge:
    padding: "4px 10px"
    fontSize: 12
    fontWeight: 500
    radius: "full"
  
  tooltip:
    maxWidth: 280
    padding: "8px 12px"
    fontSize: 13
    gap: 8
  
  modal:
    maxWidth:
      sm: 400
      md: 560
      lg: 720
      xl: 960
    padding: 24
    radius: 16
    backdropBlur: 4
  
  toast:
    minWidth: 280
    maxWidth: 420
    padding: "14px 16px"
    gap: 12
    borderRadius: 10
  
  table:
    headerHeight: 48
    rowHeight: 52
    cellPadding: "12px 16px"
    stickyHeader: true

# ═══════════════════════════════════════════
# MOTION SYSTEM
# ═══════════════════════════════════════════
motion:
  durations:
    instant: 0
    fast: 100
    normal: 200
    slow: 300
    slower: 400
    slowest: 500
  easings:
    easeOut: "cubic-bezier(0.16, 1, 0.3, 1)"
    easeIn: "cubic-bezier(0.55, 0, 1, 0.45)"
    easeInOut: "cubic-bezier(0.65, 0, 0.35, 1)"
    spring: "cubic-bezier(0.34, 1.56, 0.64, 1)"
    sharp: "cubic-bezier(0.4, 0, 0.2, 1)"
  stagger: 50  # ms per item
  reducedMotion: "prefers-reduced-motion: reduce"

# ═══════════════════════════════════════════
# DARK MODE OVERRIDES (per theme)
# ═══════════════════════════════════════════
darkMode:
  strategy: "class"  # .dark on html
  rules:
    # Universal dark mode adjustments
    background: "{color.primitive.neutral.950}"
    surface: "{color.primitive.neutral.900}"
    surfaceRaised: "{color.primitive.neutral.800}"
    border: "{color.primitive.neutral.700}"
    borderStrong: "{color.primitive.neutral.600}"
    textPrimary: "{color.primitive.neutral.50}"
    textSecondary: "{color.primitive.neutral.300}"
    textMuted: "{color.primitive.neutral.500}"
    textInverse: "{color.primitive.neutral.950}"
    overlay: "rgba(0,0,0,0.7)"
    # Primary lightens on dark
    primary: "{color.primitive.primary.400}"
    primaryHover: "{color.primitive.primary.300}"
    primaryLight: "{color.primitive.primary.900} / 0.3"
    # Shadows become borders/glows
    shadows:
      sm: "0 1px 2px rgba(0,0,0,0.3)"
      md: "0 4px 6px rgba(0,0,0,0.4), 0 0 1px {color.primary} / 0.2"
      lg: "0 10px 15px rgba(0,0,0,0.5), 0 0 1px {color.primary} / 0.15"
      xl: "0 20px 25px rgba(0,0,0,0.6), 0 0 1px {color.primary} / 0.1"

# ═══════════════════════════════════════════
# ACCESSIBILITY DEFAULTS
# ═══════════════════════════════════════════
a11y:
  contrast:
    aa: 4.5
    aaLarge: 3
    aaa: 7
    aaaLarge: 4.5
  focusVisible: true
  skipLink: true
  reducedMotion: true
  minTouchTarget: 44